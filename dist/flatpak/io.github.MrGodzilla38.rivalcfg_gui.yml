id: io.github.MrGodzilla38.rivalcfg_gui
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: run.sh
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --device=all
  - --env=GTK_THEME=Adwaita:dark
  - --filesystem=/run/udev:ro
  - --filesystem=/sys/bus/usb:ro
  - --filesystem=/sys/bus/hid:ro
  - --talk-name=org.freedesktop.Flatpak

cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - '*.la'
  - '*.a'

modules:
  - python3-requirements.json

  - name: rivalcfg-gui
    buildsystem: simple
    build-commands:
      # The application is one package directory now, with assets/ and locales/
      # inside it, so it is copied wholesale.  The per-module list this replaces
      # was missing lighting_fx.py and aerox5_mesh.py -- both of which the app
      # imports -- so the installed GUI could not start, and the locales had to
      # be duplicated into /app/share/locale by hand.
      - install -d /app/lib/rivalcfg-gui
      - cp -r rivalcfg_gui /app/lib/rivalcfg-gui/rivalcfg_gui
      - find /app/lib/rivalcfg-gui -name '__pycache__' -type d -prune -exec rm -rf {} +
      - find /app/lib/rivalcfg-gui -name '*.pyc' -delete
      - install -Dm755 dist/flatpak/run.sh /app/bin/run.sh
      - install -Dm644 dist/flatpak/io.github.MrGodzilla38.rivalcfg_gui.desktop /app/share/applications/io.github.MrGodzilla38.rivalcfg_gui.desktop
      - install -Dm644 dist/flatpak/io.github.MrGodzilla38.rivalcfg_gui.metainfo.xml /app/share/metainfo/io.github.MrGodzilla38.rivalcfg_gui.metainfo.xml
      - install -Dm644 rivalcfg_gui/assets/logo.png /app/share/icons/hicolor/256x256/apps/io.github.MrGodzilla38.rivalcfg_gui.png
    sources:
      - type: dir
        path: ../..
